{% extends "templates/web.html" %}

{% block page_content %}

<div class="container py-5">
    <div class="row">
        <div class="col-lg-6">

            <div class="form-group mb-3">
                <label for="data">Data to Encode <span class="text-danger">*</span></label>
                <input
                    id="data"
                    class="form-control"
                    placeholder="ABC123, https://example.com etc."
                    required
                >
            </div>

            <div class="form-group mb-3">
                <label for="type">Type (URL or Text)<span class="text-danger">*</span></label>
                <select id="type" class="form-control" required>
                    <option value="" selected disabled>Select...</option>
                    <option value="URL">URL</option>
                    <option value="Text">Text</option>
                </select>
            </div>

            <div class="form-group mb-3">
                <label for="product">Generating For <span class="text-danger">*</span></label>
                <select id="product" class="form-control" required>
                    <option value="" selected disabled>Select...</option>
                    <option value="Personal Use">Personal Use</option>
                    <option value="Humain Learning">Humain Learning</option>
                    <option value="HAILM">HAILM</option>
                </select>
            </div>

            <div id="branding-options" hidden>
                <div class="form-check mb-2">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="brand_colours"
                        checked
                    >
                    <label class="form-check-label" for="brand_colours">
                        Use Brand Colours
                    </label>
                </div>

                <div class="form-check mb-3">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="brand_logo"
                        checked
                    >
                    <label class="form-check-label" for="brand_logo">
                        Use Brand Logo
                    </label>
                </div>
            </div>

            <button
                id="generate"
                class="btn btn-primary"
            >
                Generate QR Code
            </button>

            <div
                id="error"
                class="alert alert-danger mt-3"
                style="display:none;"
            ></div>

        </div>

        <div class="col-lg-6 text-center">
            <div id="qr-result"></div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const data = document.getElementById("data");
    const type = document.getElementById("type");
    const product = document.getElementById("product");
    const brandColours = document.getElementById("brand_colours");
    const brandLogo = document.getElementById("brand_logo");
    const brandingOptions = document.getElementById("branding-options");
    const result = document.getElementById("qr-result");
    const error = document.getElementById("error");
    const button = document.getElementById("generate");

    function showError(message) {
        error.textContent = message;
        error.style.display = "";
    }

    function clearError() {
        error.textContent = "";
        error.style.display = "none";
    }

    function setLoading(loading) {
        button.disabled = loading;
        button.textContent = loading
            ? "Generating..."
            : "Generate QR Code";
    }

    function toggleBranding() {
        const branded =
            product.value === "Humain Learning" ||
            product.value === "HAILM";

        brandingOptions.hidden = !branded;

        if (!branded) {
            brandColours.checked = false;
            brandLogo.checked = false;
        } else {
            brandColours.checked = true;
            brandLogo.checked = true;
        }
    }

    product.addEventListener("change", toggleBranding);

    button.addEventListener("click", () => {
        clearError();

        if (!data.value.trim()) {
            showError("Please enter text or a URL.");
            data.focus();
            return;
        }

        if (!type.value) {
            showError("Please select a data type.");
            type.focus();
            return;
        }

        if (!product.value) {
            showError("Please select what the QR code is being generated for.");
            product.focus();
            return;
        }

        const values = {
            data: data.value.trim(),
            type: type.value,
            product: product.value,
            brand_colours: brandColours.checked ? 1 : 0,
            brand_logo: brandLogo.checked ? 1 : 0,
        };

        const filename = `${values.data.substring(0, 30)}.png`
            .replace(/[<>:"/\\|?*]+/g, "_")
            .replace(/^https?:\/\//, "");

        setLoading(true);

        frappe.call({
            method: "humain_learning.humain_learning.page.generate_qr.generate_qr.generate_qr_code",
            args: {
                values,
            },
            callback(r) {
                setLoading(false);

                if (r.exc) {
                    // frappe.throw() has already shown the dialog
                    return;
                }

                result.innerHTML = `
                    <img
                        src="${r.message.image}"
                        style="
                            max-width:400px;
                            width:100%;
                            border:1px solid #ddd;
                            border-radius:8px;
                        "
                    >

                    <div style="margin-top:24px;">
                        <a
                            href="${r.message.image}"
                            download="${filename}"
                            class="btn btn-primary"
                        >
                            Download
                        </a>
                    </div>
                `;
            },
            error() {
                setLoading(false);
                showError("An unexpected error occurred. Please try again.");
            },
        });
    });
});
</script>

{% endblock %}
